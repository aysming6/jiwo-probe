name: Sync upstream

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository != 'chnnic/jiwo-probe'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      merge_sha: ${{ steps.propose.outputs.merge_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: propose
        uses: actions/github-script@v7
        with:
          script: |
            const { propose } = require('./scripts/propose-upstream.cjs')
            await propose({ github, context, core })

  validate:
    needs: propose
    if: needs.propose.outputs.merge_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.propose.outputs.merge_sha }}
